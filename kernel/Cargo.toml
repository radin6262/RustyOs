[package]
name = "kernel"
version = "0.1.0"
edition = "2024"

[dependencies]
bootloader_api = "0.11.17"

xhci-nostd = {
    git = "https://github.com/suhteevah/xhci-nostd.git"
}

x86_64 = {
    version = "0.15.5",
    default-features = false,
    features = [
        "instructions",
        "abi_x86_interrupt",
    ],
}

ttf-parser = {
    version = "0.25.1",
    default-features = false,
    features = ["no-std-float"],
}

pic8259 = "0.10.1"
spin = "0.9.8"

wasmi = { version = "1.1.0", default-features = false }