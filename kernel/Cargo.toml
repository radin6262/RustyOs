[package]
name = "kernel"
version = "0.1.0"
edition = "2024"

[dependencies]
bootloader_api = "0.11.17"

x86_64 = {
    version = "0.15.5",
    default-features = false,
    features = [
        "instructions",
        "abi_x86_interrupt",
    ],
}

ttf-parser = {
    version = "0.25.1",
    default-features = false,
    features = ["no-std-float"],
}

pic8259 = "0.10.1"
spin = "0.9.8"


ax-sync = { version = "0.6.0", default-features = false }
ax-crate-interface = { version = "0.5.8", default-features = false }

crab-usb = { version = "0.12.1", default-features = false }
dma-api = { version = "0.10.2", default-features = false }

derive_more = { version = "2.1.1", default-features = false, features = ["full"] }
thiserror = { version = "2", default-features = false }

xhci = "0.9.2"